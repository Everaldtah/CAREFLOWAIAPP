---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: careflow-ai

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: careflow-backend
    newName: your-registry/careflow-backend
    newTag: latest
  - name: careflow-frontend
    newName: your-registry/careflow-frontend
    newTag: latest

replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 2
