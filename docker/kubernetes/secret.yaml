---
apiVersion: v1
kind: Secret
metadata:
  name: careflow-secrets
  namespace: careflow-ai
type: Opaque
stringData:
  # Generate these values and update before deploying
  DATABASE_URL: "postgresql://user:password@postgres:5432/careflow"
  REDIS_URL: "redis://:password@redis:6379/0"
  SECRET_KEY: "your-secret-key-here-32-bytes-minimum"
  SECRET_KEY_REFRESH: "your-refresh-secret-key-here"
  ENCRYPTION_KEY: "your-encryption-key-64-hex-characters"
  OPENAI_API_KEY: "sk-your-openai-api-key"
  SMTP_HOST: "smtp.resend.com"
  SMTP_USER: "resend"
  SMTP_PASSWORD: "your-smtp-password"
