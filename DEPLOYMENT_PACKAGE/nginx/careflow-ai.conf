# =============================================================================
# CareFlow AI - Nginx Configuration
# =============================================================================
#
# This configuration handles reverse proxy for CareFlow AI
# Subdomain: careflowAI.YOUR-DOMAIN.COM
#
# Place this file at: /etc/nginx/sites-available/careflow-ai.conf
# Then enable with: sudo ln -s /etc/nginx/sites-available/careflow-ai.conf /etc/nginx/sites-enabled/
# =============================================================================

# Upstream servers
upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream frontend {
    server 127.0.0.1:3001;
}

# Rate limiting zones
limit_req_zone $api_limit zone=10m rate=10r/s;
limit_req_zone $auth_limit zone=10m rate=5r/s;

# HTTP server - Redirect to HTTPS
server {
    listen 80;
    server_name YOUR-DOMAIN.COM www.YOUR-DOMAIN.COM;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server - Main application
server {
    listen 443 ssl http2;

    server_name careflowAI.YOUR-DOMAIN.COM www.careflowAI.YOUR-DOMAIN.COM;

    # SSL Certificate configuration (Let's Encrypt or Cloudflare)
    ssl_certificate /etc/letsencrypt/live/careflowAI.YOUR-DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careflowAI.YOUR-DOMAIN.COM/privkey.pem;

    # SSL Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/careflow-frontend-access.log;
    error_log /var/log/nginx/careflow-frontend-error.log;

    # Root location - Redirect to careflowAI subdomain
    location = / {
        return 301 https://careflowAI.YOUR-DOMAIN.COM;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://backend/health;
        proxy_pass http://backend/health;
        access_log off;
    }
}

# HTTPS server - CareFlow AI subdomain (application)
server {
    listen 443 ssl http2;

    server_name careflowAI.YOUR-DOMAIN.COM;

    # SSL Certificate
    ssl_certificate /etc/letsencrypt/live/careflowAI.YOUR-DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careflowAI.YOUR-DOMAIN.COM/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://api.careflowAI.YOUR-DOMAIN.COM; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.careflowAI.YOUR-DOMAIN.COM https://YOUR-DOMAIN.COM; font-src data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Logging
    access_log /var/log/nginx/careflow-app-access.log;
    error_log /var/log/nginx/careflow-app-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/xml+rss application/json application/javascript;

    # Frontend (React/Next.js)
    location / {
        # Proxy to frontend
        proxy_pass http://frontend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;

        # Next.js specific
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (FastAPI)
    location /api/ {
        # Proxy to backend
        proxy_pass http://backend;

        # Strip /api/ prefix when forwarding
        rewrite ^/api/(.*) /$1 break;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS handling
        proxy_hide_header X-Powered-By;

        # Rate limiting (stricter for API)
        limit_req zone=$api_limit burst=20 nodelay;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffering for large requests
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 8k;

        # File upload size
        client_max_body_size 10M;
    }

    # Auth endpoints (stricter rate limiting)
    location /api/v1/auth/ {
        proxy_pass http://backend;

        # Strip prefix
        rewrite ^/api/v1/auth/(.*) /api/v1/auth/$1 break;

        # Stricter rate limit for auth
        limit_req zone=$auth_limit burst=10 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
