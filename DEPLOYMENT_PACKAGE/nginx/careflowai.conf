# =============================================================================
# CareFlow AI - Nginx Configuration for careflowai subdomain
# =============================================================================
#
# This configuration handles reverse proxy for CareFlow AI application
# running on your existing web server alongside your current site.
# =============================================================================

# Upstream servers (Docker containers)
upstream careflow_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream careflow_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# =============================================================================
# HTTP Server - Redirect careflowai subdomain to CareFlow AI
# =============================================================================
server {
    listen 80;
    server_name careflowai.veraldabs.co.uk www.careflowai.veraldabs.co.uk;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS Server - CareFlow AI Application (careflowai subdomain)
# =============================================================================
server {
    listen 443 ssl http2;

    server_name careflowai.veraldabs.co.uk;

    # SSL Certificate (Let's Encrypt or Cloudflare)
    ssl_certificate /etc/letsencrypt/live/careflowai.veraldabs.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careflowai.veraldabs.co.uk/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(); microphone=(); camera=()" always;

    # Logging
    access_log /var/log/nginx/careflowai-app-access.log;
    error_log /var/log/nginx/careflowai-app-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/xml+rss application/json application/javascript;

    # =============================================================================
    # CareFlow AI Frontend (React/Next.js)
    # =============================================================================
    location / {
        # Proxy to frontend
        proxy_pass http://careflow_frontend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;

        # Next.js specific
        proxy_cache_bypass $http_upgrade;

        # Allow large uploads
        client_max_body_size 10M;
    }

    # =============================================================================
    # CareFlow AI Backend API (FastAPI)
    # =============================================================================
    location /api/ {
        # Proxy to backend
        proxy_pass http://careflow_backend;

        # Strip /api/ prefix when forwarding
        rewrite ^/api/(.*) /api/v1/$1 break;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting (stricter for API)
        limit_req zone=$api_limit burst=20 nodelay;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffering for large requests
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 8k;

        # Hide backend headers
        proxy_hide_header X-Powered-By;

        # File upload size
        client_max_body_size 10M;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://careflow_backend;
        access_log off;
    }
}
